<!DOCTYPE html>
<html>
<head>
    <title>ComicCraft</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            padding: 40px;
        }

        .container {
            width: 700px;
            max-width: 90%;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            font-size: 35px;
        }

        p {
            text-align: center;
            color: #666;
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 12px;
            box-sizing: border-box;
            font-size: 16px;
            border: 1px solid #aaa;
            border-radius: 8px;
        }

        button {
            display: block;
            margin: 20px auto;
            padding: 12px 25px;
            background: black;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .download {
            background: #333;
        }

        .result {
            margin-top: 25px;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 10px;
            white-space: pre-wrap;
            line-height: 1.7;
        }.comic-panels {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
    margin-top: 25px;
}

.panel {
    padding: 10px;
    border: 3px solid #222;
    border-radius: 12px;
    background: white;
    text-align: center;
    overflow: hidden;
}

.panel img {
    width: 100%;
    height: 260px;
    object-fit: cover;
    border-radius: 8px;
    display: block;
    margin-bottom: 10px;
}

.panel h3 {
    margin: 5px 0 10px;
}

.panel p {
    text-align: center;
    color: #333;
}
.panel h3 {
    margin-top: 0;
}

.panel p {
    text-align: left;
    color: #333;
}
    </style>
</head>

<body>

<div class="container">

    <h1>🎨 ComicCraft</h1>

    <p>AI Comic Story Creator</p>

    <form method="post" action="/generate">

        <textarea
            name="idea"
            placeholder="Enter your comic story idea here..."
            required>{{ idea }}</textarea>

        <button type="submit">
            ✨ Generate Comic
        </button>

    </form>


    {% if story %}
    <div class="comic-panels">

   <div class="panel">
    <h3>🖼️ Panel 1</h3>
    <img src="static/images/comic_panels_916/panel1.png" alt="Panel 1">
    <p>The student gets a funny idea.</p>
</div>

    <div class="panel">
    <h3>🖼️ Panel 2</h3>
    <img src="static/images/comic_panels_916/panel2.png" alt="Panel 2">
    <p>The student meets an AI robot.</p>
</div>

    <div class="panel">
    <h3>🖼️ Panel 3</h3>
    <img src="static/images/comic_panels_916/panel3.png" alt="Panel 3">
    <p>The robot creates a funny comic.</p>
</div>

    <div class="panel">
    <h3>🖼️ Panel 4</h3>
    <img src="static/images/comic_panels_916/panel4.png" alt="Panel 4">
    <p>Everyone laughs and enjoys the story! 😂</p>
</div>

</div>

    <div class="result">

        <h2>📖 Your Comic Story</h2>

        {{ story }}

    </div>


    <form method="post" action="/download">

        <input
            type="hidden"
            name="idea"
            value="{{ idea }}">

        <button type="submit" class="download">
            📄 Download PDF
        </button>

    </form>

    {% endif %}

</div>

</body>
</html>
